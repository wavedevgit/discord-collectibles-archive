name: Archive Collectibles

on:
    schedule:
        - cron: '*/30 * * * *'
    workflow_dispatch:

jobs:
  archive:
    permissions:
      contents: read-write
    runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '20'

            - name: Install dependencies
              run: npm install
              working-directory: .

            - name: Run archive script
              run: node archive.js

            - name: Commit and push
              run: |
                  git config --local user.email "github-actions[bot]@users.noreply.github.com"
                  git config --local user.name "github-actions[bot]"
                  git add data/
                  git diff --staged --quiet || git commit -m "Archive collectibles data $(date -I)"
                  git push
